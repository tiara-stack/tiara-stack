infisical:
  enabled: true
  projectId: 55408658-aa53-475f-9ac6-e1bfa9e207fe
  connection:
    address: https://infisical.theerapakg.moe

ingress:
  enabled: true
  name: theerapakg-moe-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: theerapakg-moe-tls
      hosts:
        - auth.theerapakg.moe
        - schedule.theerapakg.moe
        - zero.theerapakg.moe
        - workflows.theerapakg.moe
  hosts:
    - host: auth.theerapakg.moe
      path: /
      pathType: Prefix
      serviceName: sheet-auth-service
      servicePort: 80
    - host: schedule.theerapakg.moe
      path: /
      pathType: Prefix
      serviceName: sheet-web-service
      servicePort: 80
    - host: zero.theerapakg.moe
      path: /
      pathType: Prefix
      serviceName: zero-cache-service
      servicePort: 4848
    - host: workflows.theerapakg.moe
      path: /
      pathType: Prefix
      serviceName: sheet-workflows-service
      servicePort: 80

global:
  nodeSelector:
    doks.digitalocean.com/node-pool: pool-tiara-stack
  tolerations:
    - key: deployment
      operator: Equal
      value: tiara-stack
      effect: NoSchedule
  caCertificate:
    enabled: true
    existingConfigMap: tiara-stack-ca-certificate

services:
  sheetWeb:
    env:
      SHEET_WORKFLOWS_BASE_URL: https://workflows.theerapakg.moe
  sheetWorkflows:
    secretRef:
      name: sheet-workflows-secret
  sheetWorkflowsRunner:
    secretRef:
      name: sheet-workflows-secret
    # The ordinary runner exceeded the shared 512Mi limit during production startup.
    # Reserve enough heap for workflow module loading while keeping room on the DOKS node.
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 2Gi
  sheetWorkflowsBrowserRunner:
    secretRef:
      name: sheet-workflows-secret

zeroCache:
  persistence:
    # DigitalOcean-specific storage class. Replace for other providers, or
    # leave empty to use the cluster default.
    storageClassName: do-block-storage

meilisearch:
  persistence:
    # Match zero-cache retention: bind a pre-created DigitalOcean volume in CI.
    storageClassName: do-block-storage

monitoring:
  migrationDashboard:
    enabled: true
  rolloutGateAlerts:
    enabled: true
