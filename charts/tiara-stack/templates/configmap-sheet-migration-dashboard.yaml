{{- if .Values.monitoring.migrationDashboard.enabled }}
{{- $prometheusDatasourceUid := required "monitoring.prometheusDatasourceUid is required when migrationDashboard is enabled" .Values.monitoring.prometheusDatasourceUid }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: sheet-migration-dashboard
  labels:
    {{- include "tiara-stack.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    app: sheet-workflows
data:
  sheet-migration.json: |
    {
      "uid": "sheet-migration",
      "title": "TiaraStack sheet migration",
      "tags": ["tiara-stack", "migration"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": {{ $prometheusDatasourceUid | toJson }} },
            "query": "label_values(up, namespace)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": { "text": "All", "value": ["$__all"] }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Rollout Gate evaluations",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": {{ $prometheusDatasourceUid | toJson }} },
          "targets": [{ "expr": "sum by (executionPath) (rate(sheet_workflows_rollout_gate_evaluations_total{namespace=~\"$namespace\"}[$__rate_interval]))", "legendFormat": "{{ "{{executionPath}}" }}", "refId": "A" }]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Workflow HTTP enqueue outcomes",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": {{ $prometheusDatasourceUid | toJson }} },
          "targets": [{ "expr": "sum by (outcome) (rate(sheet_workflows_http_enqueues_total{namespace=~\"$namespace\"}[$__rate_interval]))", "legendFormat": "{{ "{{outcome}}" }}", "refId": "A" }]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Rollout Gate fallbacks",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": {{ $prometheusDatasourceUid | toJson }} },
          "targets": [{ "expr": "sum by (reason) (rate(sheet_workflows_rollout_gate_fallbacks_total{namespace=~\"$namespace\"}[$__rate_interval]))", "legendFormat": "{{ "{{reason}}" }}", "refId": "A" }]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Target workload availability",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": {{ $prometheusDatasourceUid | toJson }} },
          "targets": [{ "expr": "kube_deployment_status_replicas_available{namespace=~\"$namespace\",deployment=~\"sheet-workflows(-runner|-browser-runner)?\"}", "legendFormat": "{{ "{{deployment}}" }}", "refId": "A" }]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Ambiguous bot deliveries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": {{ $prometheusDatasourceUid | toJson }} },
          "targets": [{ "expr": "sum by (outcome) (rate(sheet_bot_delivery_ambiguous_outcomes_total{namespace=~\"$namespace\"}[$__rate_interval]))", "legendFormat": "{{ "{{outcome}}" }}", "refId": "A" }]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Unresolved delivery reservations",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": {{ $prometheusDatasourceUid | toJson }} },
          "targets": [{ "expr": "sum(sheet_bot_delivery_unresolved_reservations{namespace=~\"$namespace\"})", "legendFormat": "reservations", "refId": "A" }]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Oldest unresolved delivery (seconds)",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 16 },
          "datasource": { "type": "prometheus", "uid": {{ $prometheusDatasourceUid | toJson }} },
          "targets": [{ "expr": "max(sheet_bot_delivery_oldest_unresolved_age_seconds{namespace=~\"$namespace\"})", "legendFormat": "seconds", "refId": "A" }]
        }
      ]
    }
{{- end }}
